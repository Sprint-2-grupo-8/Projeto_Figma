<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GasControl | Cadastro</title>
    <link rel="stylesheet" href="styles/usuario.css">
    <link rel="stylesheet" href="styles/global.css">
    <link rel="shortcut icon" href="assets/img/Frame.svg" >
</head>

<body>
    <header>
        <div class="container">

            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">
                <img src="assets/img/Frame.svg">
                <h1>GasControl</h1>
            </a>

            <div class="header-right">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="sobre.html">Sobre o Projeto</a></li>
                        <li><a href="simulador.html">Calculadora Financeira</a></li>
                    </ul>
                </nav>

                <button class="btn-login" onclick="ir_login()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Login / Cadastro
                </button>
            </div>

        </div>
    </header>

    <div class="page-center" id="funcionario">
        <div class="form-card">

            <h1 class="titulo">Cadastro de Usuário</h1>

            <h3>Nome</h3>
            <input type="text" id="ipt_nome_func" placeholder="Seu nome completo">

            <h3>CPF</h3>
            <input type="text" id="ipt_cpf_func" placeholder="Sem traços ou pontos">

            <h3>Token da Empresa</h3>
            <input type="text" id="ipt_token" placeholder="Digite o token da sua empresa">

            <h3>Cargo</h3>
            <select name="Cargo" id="slc_cargo">
                <option value="Comum">Funcionário Comum</option>
                <option value="ADM">Funcionário Administrador</option>
            </select>

            <h3>Email</h3>
            <input type="email" id="ipt_email_func" placeholder="Email corporativo">

            <h3>Senha</h3>
            <input type="password" id="ipt_senha" placeholder="******">

            <h3>Confirme a senha</h3>
            <input type="password" id="ipt_c_senha" placeholder="******">

            <div id="erro_senha" class="vermelho bold"></div>

            <div class="form-actions">
                <button class="primary" onclick="cadastrar_func()">Cadastrar</button>
                <button class="secondary" onclick="ir_login()">Já tenho conta</button>
            </div>
            <div></div>
        </div>
    </div>
    </div>


</body>
<script src="js/usuario.js"></script>

</html>
