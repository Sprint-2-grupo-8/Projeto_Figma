<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/usuario.css">
    <link rel="stylesheet" href="styles/global.css">

</head>

<body>

    <header>
        <div class="container">

            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">
                <img src="assets/img/Frame.svg">
                <h1>GasControl</h1>
            </a>

            <div class="header-right">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="sobre.html">Sobre o Projeto</a></li>
                        <li><a href="simulador.html">Calculadora Financeira</a></li>
                    </ul>
                </nav>

                <button class="btn-login" onclick="ir_cadastro()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Login / Cadastro
                </button>
            </div>
        </div>
    </header>

    <div class="page-center">
        <div class="form-card">

            <h1 class="titulo">Login</h1>

            <input type="email" id="ipt_email" placeholder="Digite seu email">
            <input type="password" id="ipt_senha" placeholder="Digite sua senha">

            <div id="confirmacao_login" class="vermelho bold"></div>

            <div class="form-actions">
                <button class="primary" onclick="logar()">Entrar</button>
                <button class="secondary" onclick="ir_cadastro()">Criar conta</button>
            </div>
        </div>
    </div>
</body>
<script src="js/usuario.js"></script>

</html>
