<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles/usuario.css">
    <link rel="stylesheet" href="styles/global.css">

</head>

<body>

    <header>
        <div class="container">

            <div class="logo">
                <img src="assets/img/Frame.svg">
                <h1>GasControl</h1>
            </div>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="simulador.html">Simulador</a></li>
                </ul>
            </nav>

            <button class="entrar" onclick="mudarJanela('./login.html')">Entrar</button>

        </div>
    </header>

    <div class="page-center">
        <div class="form-card">

            <h1 class="titulo">Login</h1>

            <input type="email" id="ipt_email" placeholder="Digite seu email">
            <input type="password" id="ipt_senha" placeholder="Digite sua senha">

            <div id="confirmacao_login" class="vermelho bold"></div>

            <div class="form-actions">
                <button class="primary" onclick="logar()">Entrar</button>
                <button class="secondary" onclick="ir_cadastro()">Criar conta</button>
            </div>

        </div>
    </div>

    <script src="js/usuario.js"></script>
</body>

</html>
