<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/bobia.js"></script>
    <title>Bob IA - V1</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        .container_bob{
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            min-height: 100vh;
            
        }

        .btn_bob{
            display: flex;
            width: 40px;
            background-color: lightgreen;
            border-top-left-radius: 20px;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            transition: 0.4s ease-in-out;
        }

        .btn_bob:hover{
            background-color: green;
            color: white;
        }

        .chat_bob, .btn_bob{
            height: 350px;
        }

        .chat_bob{
            display: flex;
            width: 40%;
            background-color: white;
            flex-direction: column;
        }

        .chat_titulo{
            display: flex;
            justify-content: center;
        }

        .chat_titulo> p{
            background-color: whitesmoke;
            width: 100%;
            text-align: center;
            padding: 10px;
            color: #8b8b8b;
        }

        .mensagem_bob{
            display: flex;
            flex-direction: column;
            margin: 5px;
            gap: 10px;
        }

        .bob_ia{
            background-color: #d3d3d3;
            width: fit-content;
            height: fit-content;
            border-radius: 20px;
            padding: 2%;
        }
        .eu{
            background-color: #60d860;
            border-radius: 20px;
            padding: 2%;
            width: fit-content;
            height: fit-content;
            text-align: end;
            align-self: flex-end;
        }
    </style>
</head>

<body>
    <div class="container_bob">
        <button class="btn_bob" onclick="aparecer()">
            ←
        </button>
        <div class="chat_bob">
            <div class="chat_titulo">
                <p>BobIA</p>
            </div>
            <div class="mensagem_bob">
                <p class="bob_ia">Oi, como posso ajudar?</p>
                <p class="eu">Nada</p>
            </div>
            
        </div>
    </div>
</body>

</html>
