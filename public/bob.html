<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/bobia.js"></script>
    <title>Bob IA - V1</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .container_bob{
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            min-height: 100vh;
            
        }

        .btn_bob{
            display: flex;
            width: 40px;
            background-color: lightgreen;
            border-top-left-radius: 20px;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            transition: 0.4s ease-in-out;
        }

        .btn_bob:hover{
            background-color: green;
            color: white;
        }

        .chat_bob, .btn_bob{
            height: 350px;
        }

        .chat_bob{
            display: flex;
            width: 40%;
            background-color: white;
            flex-direction: column;
        }

        .chat_titulo{
            display: flex;
            justify-content: center;
        }

        .chat_titulo> p{
            background-color: whitesmoke;
            width: 100%;
            text-align: center;
            padding: 10px;
            color: #8b8b8b;
        }
    </style>
</head>

<body>
    <div class="container_bob">
        <button class="btn_bob" onclick="aparecer()">
            ←
        </button>
        <div class="chat_bob">
            <div class="chat_titulo">
                <p>BobIA</p>
            </div>
            <p>Oi, como posso ajudar</p>
            <p>Com nada</p>
        </div>
    </div>
</body>

</html>
