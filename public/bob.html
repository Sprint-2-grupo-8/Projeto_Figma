<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/bob.css">
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="styles/painel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
        
    <script src="js/bobia.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.1.0/chartjs-plugin-annotation.min.js"
        integrity="sha512-8MntMizyPIYkcjoDkYqgrQOuWOZsp92zlZ9d7M2RCG0s1Zua8H215p2PdsxS7qg/4hLrHrdPsZgVZpXheHYT+Q=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <title>Suporte</title>
</head>

<body>
    <div class="left-painel">
        <div class="logo">
            <img src="assets/img/logo branca.svg">
            <a href="index.html"><span>GasControl</span></a>
        </div>

        <span>MENU</span>
        <ul>
            <li>
                <img src="assets/img/dashboard.svg" alt="">
                <a href="dashboard.html">Dashboard</a>
            </li>
            <li class="active">
                <img src="assets/img/alerta.svg" alt="">
                <a href="painel.html">
                    <span class="nav-label">Alertas</span>
                    <span id="id_qtd_alertas"></span>
                </a>
            </li>
        </ul>

        <span>GERAL</span>
        <ul>
            <!-- <li>
                <img src="assets/img/admin.svg" alt="">
                <a href="login_suporte.html"> Acesso ao Suporte </a>
            </li> -->
            <li>
                <img src="assets/img/logout.svg" alt="">
                <a href="index.html">Logout</a>
            </li>
        </ul>
    </div>

    <div class="container_bob">
        <button class="btn_bob" id="btn_bob">
            <p class="seta" id="setaChat">←</p>
        </button>
        <div class="chat_bob" id="Chat_Bob">
            <div class="chat_titulo">
                <p>BobIA</p>
            </div>
            <div class="mensagem_bob">
                <p class="bob_ia">Oi, como posso ajudar?</p>
                <p class="eu">Nada</p>
            </div>
            <div class="caixa_texto">
                <input type="text" class="ipt_texto" placeholder="Pergunte algo ....">
                <button class="Conversar" onclick="conversar()">+</button>
            </div>
        </div>
    </div>
</body>
<script>
    const Chat = document.getElementById('Chat_Bob');
    const btn = document.getElementById('btn_bob');
    const Seta = document.getElementById('setaChat');

    btn.addEventListener('click', () => {
        Chat.classList.toggle('chat_bob_ativo')
        Seta.classList.toggle('seta_ativa')
    })
</script>
</html>
